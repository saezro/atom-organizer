[package]
name = "atom_rs"
version = "0.1.0"
edition = "2021"
description = "Aceleradores Rust de ATOM Organizer (puente pyo3, abi3-py311)"
license = "UNLICENSED"
publish = false

[lib]
name = "atom_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["abi3-py311"] }
rayon = "1.10"
# JPEG de gris/colormap con libjpeg-turbo (la misma familia que trae Pillow).
# Sin `require-simd`/`pkg-config`: se compila la libjpeg-turbo vendorizada con
# cmake; con nasm disponible lleva SIMD, sin él cae a C (mismos bytes, más lento).
turbojpeg = { version = "=1.5.1", default-features = false, features = ["cmake"] }
# Fija la libjpeg-turbo vendorizada (3.1.0): `termica::LIBJPEG_TURBO_VERSION` la declara.
turbojpeg-sys = { version = "=1.2.0", default-features = false }

[features]
# maturin activa extension-module al construir la wheel; `cargo test` va sin él
# para poder enlazar contra libpython.
extension-module = ["pyo3/extension-module"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
