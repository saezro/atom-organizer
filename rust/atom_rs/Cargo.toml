[package]
name = "atom_rs"
version = "0.1.0"
edition = "2021"
description = "Aceleradores Rust de ATOM Organizer (puente pyo3, abi3-py311)"
license = "UNLICENSED"
publish = false

[lib]
name = "atom_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["abi3-py311"] }
rayon = "1.10"
# JPEG de gris/colormap con libjpeg-turbo (la misma familia que trae Pillow).
# Sin `pkg-config`: se compila la libjpeg-turbo vendorizada con cmake. `require-simd`
# hace fallar el build si falta nasm (en vez de caer a C, más lento); CI instala nasm
# (Windows con setup-nasm, Linux x86_64 con apt; el runner Linux no lo trae).
turbojpeg = { version = "=1.5.1", default-features = false, features = ["cmake", "require-simd"] }
# Fija la libjpeg-turbo vendorizada (3.1.0): `termica::LIBJPEG_TURBO_VERSION` la declara.
turbojpeg-sys = { version = "=1.2.0", default-features = false }
# Subida GCS (Task 6): crates aprobados por Rodrigo 2026-11-16 (+ bytes). Ninguno más.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "http2", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "fs", "time", "sync"] }
md-5 = "0.10"
crc32c = "0.6"
base64 = "0.22"
# Cuerpo de los PUT como `Bytes` (clon por refcount al reintentar). Aprobado por Rodrigo 2026-11-16.
bytes = "1"

[features]
# maturin activa extension-module al construir la wheel; `cargo test` va sin él
# para poder enlazar contra libpython.
extension-module = ["pyo3/extension-module"]
# Puntos de inyección de fallos de `fallos.rs` (solo wheel de TEST; nunca release).
inyeccion-fallos = []

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
