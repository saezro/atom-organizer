[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "atom_rs"
version = "0.1.0"
description = "Aceleradores Rust de ATOM Organizer"
requires-python = ">=3.11"
classifiers = ["Programming Language :: Rust"]

[tool.maturin]
features = ["pyo3/extension-module", "pyo3/abi3-py311"]
module-name = "atom_rs"
