[paths]
ruta_thermoviewer = C:\Program Files (x86)\ThermoViewer\ThermoViewer.exe

[percentage_by_models]
# Los % de recorte por defecto viven en config/recortes_modelos.csv (tabla versionada
# con cada version: modelo,camara,porcentaje,nota). Esta seccion es SOLO un override
