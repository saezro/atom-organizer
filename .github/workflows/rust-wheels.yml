name: rust-wheels

# Construye la wheel `atom_rs` (crate rust/atom_rs, pyo3 + maturin, abi3-py311):
#   - windows-latest  x86_64          -> escritorio Windows
#   - ubuntu-24.04    x86_64 manylinux -> AppImage y Cloud Run Job
#   - ubuntu-24.04    aarch64 manylinux (cross, --zig) -> Raspberry Pi (Py 3.11 y 3.13, por abi3)
# Artefactos `wheel-<plataforma>` con `atom_rs-*.whl`. Lo reutiliza release.yml (workflow_call).
# `cargo test` y `maturin` solo se ejecutan aquí (atom-dev-nl no tiene toolchain Rust).
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths: ['rust/**', '.github/workflows/rust-wheels.yml', 'packaging/requirements/requirements-rust.txt']

permissions:
  contents: read

jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            zig: false
          - nombre: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            zig: true
          - nombre: linux-aarch64
            os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            zig: true
    name: wheel ${{ matrix.nombre }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Toolchain Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: maturin (+ ziglang)
        run: python -m pip install -r packaging/requirements/requirements-rust.txt
      # Los tests de cargo solo corren en el target nativo (aarch64 es cruzado).
      - name: cargo test
        if: matrix.nombre != 'linux-aarch64'
        working-directory: rust/atom_rs
        run: cargo test
      # manylinux 2_28 con zig: la wheel vale para la glibc del AppImage (24.04), el Job
      # (bookworm) y la Pi (bookworm). Windows construye nativo con MSVC.
      - name: maturin build (Linux, zig)
        if: matrix.zig
        working-directory: rust/atom_rs
        run: maturin build --release --target ${{ matrix.target }} --zig --compatibility manylinux_2_28 --out dist
      - name: maturin build (Windows)
        if: ${{ !matrix.zig }}
        working-directory: rust/atom_rs
        run: maturin build --release --target ${{ matrix.target }} --out dist
      - name: Smoke de import (solo plataformas nativas)
        if: matrix.nombre != 'linux-aarch64'
        shell: bash
        run: |
          python -m pip install --no-index --find-links rust/atom_rs/dist atom_rs
          python -c "import atom_rs; print(atom_rs.version(), atom_rs.version_abi())"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheel-${{ matrix.nombre }}
          path: rust/atom_rs/dist/atom_rs-*.whl
          if-no-files-found: error
