name: rust-wheels

# Construye la wheel `atom_rs` (crate rust/atom_rs, pyo3 + maturin, abi3-py311):
#   - windows-latest  x86_64          -> escritorio Windows
#   - ubuntu-24.04    x86_64 manylinux -> AppImage y Cloud Run Job
#   - ubuntu-24.04    aarch64 manylinux (cross, --zig) -> Raspberry Pi (Py 3.11 y 3.13, por abi3)
# Artefactos `wheel-<plataforma>` con `atom_rs-*.whl`. Lo reutiliza release.yml (workflow_call).
# `cargo test` y `maturin` solo se ejecutan aquí (atom-dev-nl no tiene toolchain Rust).
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths: ['rust/**', '.github/workflows/rust-wheels.yml', 'packaging/requirements/requirements-rust.txt']

permissions:
  contents: read

jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            zig: false
          - nombre: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            zig: true
          - nombre: linux-aarch64
            os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            zig: true
    name: wheel ${{ matrix.nombre }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      # Cache de la wheel por hash de fuentes Rust + target. La clave lleva la semana ISO
      # para que el toolchain `stable` (flotante) se reconstruya como mucho 1 vez/semana.
      # Hit = se salta toolchain, cargo test y maturin; el artefacto sale igual (mismo nombre).
      # Solo se guarda tras build + smoke en verde (save separado del restore).
      - name: Clave de cache (semana ISO)
        id: semana
        shell: bash
        run: echo "w=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Restaurar wheel cacheada
        id: cache-wheel
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: rust/atom_rs/dist
          key: rust-wheel-v1-${{ matrix.nombre }}-${{ steps.semana.outputs.w }}-${{ hashFiles('rust/**/*.rs', 'rust/**/Cargo.toml', 'rust/**/Cargo.lock', 'rust/atom_rs/pyproject.toml', 'packaging/requirements/requirements-rust.txt') }}
      - name: Toolchain Rust
        if: steps.cache-wheel.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: maturin (+ ziglang)
        if: steps.cache-wheel.outputs.cache-hit != 'true'
        run: python -m pip install -r packaging/requirements/requirements-rust.txt
      # Los tests de cargo solo corren en el target nativo (aarch64 es cruzado).
      - name: cargo test
        if: matrix.nombre != 'linux-aarch64' && steps.cache-wheel.outputs.cache-hit != 'true'
        working-directory: rust/atom_rs
        run: cargo test
      # manylinux 2_28 con zig: la wheel vale para la glibc del AppImage (24.04), el Job
      # (bookworm) y la Pi (bookworm). Windows construye nativo con MSVC.
      - name: maturin build (Linux, zig)
        if: matrix.zig && steps.cache-wheel.outputs.cache-hit != 'true'
        working-directory: rust/atom_rs
        run: maturin build --release --target ${{ matrix.target }} --zig --compatibility manylinux_2_28 --out dist
      - name: maturin build (Windows)
        if: ${{ !matrix.zig && steps.cache-wheel.outputs.cache-hit != 'true' }}
        working-directory: rust/atom_rs
        run: maturin build --release --target ${{ matrix.target }} --out dist
      - name: Smoke de import (solo plataformas nativas)
        if: matrix.nombre != 'linux-aarch64'
        shell: bash
        run: |
          python -m pip install --no-index --find-links rust/atom_rs/dist atom_rs
          python -c "import atom_rs; print(atom_rs.version(), atom_rs.version_abi())"
      - name: Guardar wheel en cache
        if: steps.cache-wheel.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: rust/atom_rs/dist
          key: ${{ steps.cache-wheel.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheel-${{ matrix.nombre }}
          path: rust/atom_rs/dist/atom_rs-*.whl
          if-no-files-found: error

  # Task P: sonda de paridad libjpeg-turbo (Pillow 12.3.0 vs atom_rs) en las 3 plataformas.
  # Gate antes de T3/T4. Cada plataforma instala su wheel y corre
  # tests/test_rust_jpeg_plataforma.py; FALLA (no se salta) si falta atom_rs o el símbolo.
  # --noconftest: la sonda no importa src/ y así no arrastra las dependencias de la app.
  paridad-jpeg:
    needs: wheel
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: windows-x86_64
            os: windows-latest
            python: '3.11'
          - nombre: linux-x86_64
            os: ubuntu-24.04
            python: '3.11'
          - nombre: linux-aarch64
            os: ubuntu-24.04-arm
            python: '3.13'
    name: paridad-jpeg ${{ matrix.nombre }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wheel-${{ matrix.nombre }}
          path: wheel-dist
      - name: Instalar Pillow 12.3.0, numpy, pytest y la wheel
        shell: bash
        run: |
          python -m pip install Pillow==12.3.0 numpy==2.4.6 pytest
          python -m pip install --no-index --find-links wheel-dist atom_rs
          python -c "import atom_rs, PIL, PIL.features, platform; print(platform.machine(), PIL.__version__, PIL.features.version('libjpeg_turbo'), atom_rs.version_abi(), atom_rs.libjpeg_turbo_version())"
      - name: Instalar dependencias de la equivalencia indice (pins del proyecto)
        shell: bash
        run: |
          # Mismos pins que packaging/requirements/requirements-linux.txt (ExifRead, piexif y
          # lo que importan src/exif.py, src/utils.py y tests/conftest.py).
          grep -iE '^(ExifRead|piexif|natsort|pandas|numpy|psutil|pyexiv2|geopy|matplotlib|openpyxl|python-dateutil|Pillow)==' \
            packaging/requirements/requirements-linux.txt > req-equiv.txt
          cat req-equiv.txt
          python -m pip install -r req-equiv.txt
      - name: Equivalencia indice y rgb (atom_rs real, sin skips)
        shell: bash
        env:
          # Con atom_rs sin parsear_cabecera / ABI distinta, _rs_real() FALLA (no salta).
          ATOM_RS_REQUIRED: '1'
        run: python -m pytest tests/test_rust_indice_equiv.py tests/test_rust_rgb_ab.py tests/test_rust_bridge.py tests/test_apply_rgb.py tests/test_apply_rgb_pool_roto.py -v -rfs -p no:cacheprovider
      - name: Sonda de paridad
        shell: bash
        env:
          ATOM_RUST_AB_ESTRICTO: '1'
          ATOM_HUELLAS_DIR: huellas-out
        run: python -m pytest tests/test_rust_jpeg_plataforma.py -v -rfs --noconftest -p no:cacheprovider
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: huellas-${{ matrix.nombre }}
          path: huellas-out/huellas-*.json
          if-no-files-found: warn

  # Task 4a (fase `io`, ABI 7): paridad de `leer_completo` / `jpeg_integro_por_cola` con
  # `lectura_segura`. Necesita los puntos de inyección de fallos, que solo existen con la
  # feature `inyeccion-fallos`: se construye AQUÍ una wheel de TEST aparte (nunca se
  # sube como artefacto ni la usa release.yml; la wheel de release no lleva inyección).
  paridad-io:
    name: paridad-io linux-x86_64 (wheel de test con inyeccion-fallos)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Clave de cache (semana ISO)
        id: semana
        run: echo "w=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Restaurar wheel de TEST cacheada
        id: cache-wheel
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: rust/atom_rs/dist-test
          key: rust-wheel-test-v1-${{ steps.semana.outputs.w }}-${{ hashFiles('rust/**/*.rs', 'rust/**/Cargo.toml', 'rust/**/Cargo.lock', 'rust/atom_rs/pyproject.toml', 'packaging/requirements/requirements-rust.txt') }}
      - name: Toolchain Rust
        if: steps.cache-wheel.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - name: maturin (+ ziglang)
        if: steps.cache-wheel.outputs.cache-hit != 'true'
        run: python -m pip install -r packaging/requirements/requirements-rust.txt
      - name: maturin build (wheel de TEST, feature inyeccion-fallos)
        if: steps.cache-wheel.outputs.cache-hit != 'true'
        working-directory: rust/atom_rs
        run: maturin build --release --features inyeccion-fallos,pyo3/extension-module,pyo3/abi3-py311 --out dist-test
      - name: Guardar wheel de TEST en cache
        if: steps.cache-wheel.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: rust/atom_rs/dist-test
          key: ${{ steps.cache-wheel.outputs.cache-primary-key }}
      - name: Instalar dependencias de los tests (pins del proyecto) y la wheel de test
        shell: bash
        run: |
          python -m pip install pytest
          grep -iE '^(ExifRead|piexif|natsort|pandas|numpy|psutil|pyexiv2|geopy|matplotlib|openpyxl|python-dateutil|Pillow)==' \
            packaging/requirements/requirements-linux.txt > req-io.txt
          python -m pip install -r req-io.txt
          python -m pip install --no-index --find-links rust/atom_rs/dist-test atom_rs
          python -c "import atom_rs; print(atom_rs.version(), atom_rs.version_abi(), atom_rs.tiene_inyeccion())"
      - name: Paridad io (atom_rs real con inyeccion, sin skips)
        shell: bash
        env:
          ATOM_RS_REQUIRED: '1'
          ATOM_RUST_AB_ESTRICTO: '1'
        run: python -m pytest tests/test_rust_lectura_paridad.py tests/test_lectura_segura.py tests/test_rust_bridge.py -v -rfs -p no:cacheprovider
