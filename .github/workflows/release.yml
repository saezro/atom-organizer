name: release

# Publica una release con los dos entregables de la UI webview por cada versión:
#   - Linux:   ATOM_Organizer-<ver>-x86_64.AppImage   (Qt/QtWebEngine, atom_organizer_webview_linux.spec)
#   - Windows: ATOM-Organizer-Setup-v<ver>.exe        (instalador Inno Setup sobre el onedir)
#
# El instalador (no un .exe suelto) es lo que consume el updater in-app
# (atom_core/updater.py): lo descarga y lo lanza con /VERYSILENT.
#
# Disparo:
#   - push de un tag  vX.Y.Z  → build + release ESTABLE (la que ve el updater).
#   - push de un tag  vX.Y.Z-rc1 → igual, pero marcada pre-release (no se ofrece).
#   - manual (workflow_dispatch) → indicar la versión; crea el tag en el sha actual.
#
# El tag DEBE coincidir con version.py (el job de Windows lo verifica y falla si no).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión/tag a publicar (p.ej. v3.3)'
        required: true
      prerelease:
        description: 'Marcar como pre-release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${GITHUB_REF_NAME}"
            # Un tag limpio (v3.2.0) publica ESTABLE — el updater in-app sólo ve
            # releases estables (`/releases/latest` de GitHub ignora las pre-release).
            # Para publicar una build de prueba que NO se ofrezca a nadie, etiqueta
            # con sufijo: v3.3.0-rc1, v3.3.0-beta…
            case "$V" in
              *-*) PRE=true ;;
              *)   PRE=false ;;
            esac
            echo "version=$V" >> "$GITHUB_OUTPUT"
            echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=${{ inputs.prerelease }}" >> "$GITHUB_OUTPUT"
          fi

  # Puerta de calidad ANTES de gastar los dos builds. Nació de v3.4.24: un
  # `setForce(false)` huérfano (estado que se quitó en 4140633) reventaba
  # `pickCarpeta` en runtime, y como aquí no corría ni lint ni tests, lo único
  # que lo habría cazado era abrir la ventana a mano y mirar la consola.
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # `no-undef` es la regla que caza los identificadores que dejó atrás un
      # refactor. Sin ella el bundle compila tan feliz y falla al pulsar.
      - name: Lint y tests de la UI
        working-directory: webui
        run: |
          npm ci
          npm run lint
          npm test
      # tests/test_smoke.py comprueba que exiftool y ffmpeg están en el PATH
      # porque el pipeline los invoca como subproceso. El runner no los trae:
      # sin esto la puerta falla siempre, aunque el código esté bien.
      - name: Binarios externos del pipeline
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libimage-exiftool-perl ffmpeg
      - name: Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-linux.txt
          pip install -r requirements-webview.txt
          pip install pytest
      # test_dark_theme.py falla EN RECOLECCIÓN desde antes de este workflow;
      # se excluye para no bloquear la puerta con deuda preexistente, no porque
      # sea prescindible. Arreglarlo y quitar el --ignore es tarea aparte.
      - name: Tests
        run: python -m pytest tests/ -q --ignore=tests/test_dark_theme.py

  build-linux:
    needs: [meta, checks]
    # Era ubuntu-22.04, por construir contra la glibc más vieja posible y que el
    # AppImage corriera en cualquier sitio. Esa imagen ya no se sirve: los dos
    # intentos de v3.4.22 murieron sin ejecutar un solo paso ("The job was not
    # acquired by Runner of type hosted"). El suelo de glibc sube a la de 24.04;
    # el AppImage lo usa Linux moderno (Windows va por su instalador), así que
    # el coste es teórico y el de no publicar no lo era.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build React UI (Vite)
        working-directory: webui
        run: |
          npm ci
          npm run build
      - name: Python deps
        run: |
          python -m pip install --upgrade pip
          # requirements-linux.txt (NO requirements.txt: esa lleva pywin32, solo-Windows)
          pip install -r requirements-linux.txt
          pip install -r requirements-webview.txt
          # setuptools<81: PyInstaller 5.13.2 necesita pkg_resources (setuptools 83 lo quitó)
          pip install "setuptools==80.10.2" "pyinstaller==5.13.2"
      # El client_secret no está en el repo (es público: Google revocaría el
      # cliente por secret-scanning). Se inyecta aquí, solo en el runner.
      - name: Inyectar credenciales OAuth
        env:
          ATOM_GOOGLE_CLIENT_ID: ${{ secrets.ATOM_GOOGLE_CLIENT_ID }}
          ATOM_GOOGLE_CLIENT_SECRET: ${{ secrets.ATOM_GOOGLE_CLIENT_SECRET }}
        run: python scripts/inject_oauth_client.py
      - name: PyInstaller (onedir Qt/QtWebEngine)
        run: pyinstaller --clean --noconfirm atom_organizer_webview_linux.spec
      - name: Inject ipaddress en base_library.zip
        run: python inject_ipaddress.py
      - name: Montar AppImage
        run: bash scripts/build_appimage.sh "${{ needs.meta.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: ATOM_Organizer-*-x86_64.AppImage
          if-no-files-found: error

  build-windows:
    needs: [meta, checks]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build React UI (Vite)
        working-directory: webui
        run: |
          npm ci
          npm run build
      - name: Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-webview.txt
          pip install pyinstaller==6.6.0
      # El tag manda, pero la versión que la app enseña (y con la que compara al
      # buscar actualizaciones) sale de version.py: si no coinciden, el updater
      # ofrecería una actualización ya instalada en bucle. Se falla aquí.
      - name: Comprobar que el tag coincide con version.py
        shell: pwsh
        run: |
          $py = (python -c "from version import __version__; print(__version__)").Trim()
          # v3.2.0 y v3.2.0-rc1 valen los dos para version.py = 3.2.0
          $tag = ("${{ needs.meta.outputs.version }}".TrimStart('v') -split '-')[0]
          if ($py -ne $tag) {
            Write-Error "Tag ($tag) != version.py ($py). Actualiza version.py y vuelve a etiquetar."
            exit 1
          }
      - name: Inyectar credenciales OAuth
        env:
          ATOM_GOOGLE_CLIENT_ID: ${{ secrets.ATOM_GOOGLE_CLIENT_ID }}
          ATOM_GOOGLE_CLIENT_SECRET: ${{ secrets.ATOM_GOOGLE_CLIENT_SECRET }}
        run: python scripts/inject_oauth_client.py
      - name: PyInstaller (onedir Qt/QtWebEngine)
        run: pyinstaller --clean --noconfirm atom_organizer_webview.spec
      - name: Construir instalador (Inno Setup)
        shell: pwsh
        run: |
          $tag = "${{ needs.meta.outputs.version }}".TrimStart('v')
          # VersionInfoVersion sólo admite números → la versión va limpia (3.2.0) y
          # el sufijo (-rc1) sólo al nombre del fichero.
          $ver = ($tag -split '-')[0]
          # Inno Setup 6 viene preinstalado en los runners windows-latest
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyVersion=$ver" "/DMyTag=$tag" packaging\windows\ATOM-Organizer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/installer/ATOM-Organizer-Setup-*.exe
          if-no-files-found: error

  # La imagen del Cloud Run Job (Dockerfile.job) se construía A MANO, y por eso
  # divergía del .exe: el 2026-08-14 el tag v3.4.41 tenía release publicada y
  # updater ofreciéndola mientras el Job seguía corriendo v3.4.40 — el estadillo
  # lo notificaba la app de escritorio y no el pipeline en la nube. Aquí se
  # publica con el mismo tag y en el mismo evento que los binarios.
  #
  # NO está en `needs` de `release` a propósito: si el build de la imagen falla,
  # el workflow queda en rojo pero la release de escritorio se publica igual.
  # Bloquear el .exe por un problema de GCP sería cambiar un fallo por otro.
  imagen-job:
    needs: [meta, checks]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Necesario para que el runner pida el token OIDC con el que se federa
      # contra GCP. Sin esto, `auth` falla con "unable to get ACTIONS_ID_TOKEN".
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # Mismo control que hace build-windows: el tag manda sobre el nombre, pero
      # el código que va DENTRO de la imagen es el de version.py. Si no coinciden,
      # se publicaría una imagen mintiendo sobre su versión — justo el tipo de
      # divergencia que este job existe para evitar.
      - name: Comprobar que el tag coincide con version.py
        run: |
          PY=$(python3 -c "from version import __version__; print(__version__)")
          TAG=$(echo "${{ needs.meta.outputs.version }}" | sed 's/^v//' | cut -d- -f1)
          if [ "$PY" != "$TAG" ]; then
            echo "::error::Tag ($TAG) != version.py ($PY)"
            exit 1
          fi
      # Workload Identity Federation, no una clave JSON: el provider
      # `atom-organizer` tiene attribute-condition
      # assertion.repository=='saezro/atom-organizer', así que el token solo vale
      # desde ESTE repo y no hay credencial de larga vida que rotar ni filtrar.
      #
      # El provider va literal y no en `vars.`: no es un secreto (es un nombre de
      # recurso, y sin el token OIDC de ESTE repo no sirve de nada), y ponerlo en
      # una variable del repo añade un paso de configuración manual que, si se
      # olvida, rompe la release con un error opaco. El resto del workflow ya
      # hardcodea proyecto, región e imagen.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/217557350193/locations/global/workloadIdentityPools/github/providers/atom-organizer
          service_account: atom-compute-ops@aerotools-484814.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      # --async + polling en vez de dejar que `gcloud builds submit` espere:
      # construyendo con la SA (que no es Viewer del proyecto) el submit NO puede
      # leer el bucket de logs por defecto, imprime un ERROR de streaming y sale
      # con código 0 SIN saber cómo acabó el build. Es decir: en modo síncrono un
      # build FALLIDO puede dar el paso por verde. Aquí el veredicto sale de
      # `builds describe`, que es el estado real.
      #
      # --gcs-source-staging-dir es obligatorio: a la SA se le concedió
      # objectAdmin solo sobre el bucket de staging (a nivel proyecto le daría
      # escritura sobre gs://plantas_pv_nl), no sobre el bucket por defecto.
      - name: Construir y publicar la imagen del Job
        run: |
          set -euo pipefail
          VER="${{ needs.meta.outputs.version }}"
          ID=$(gcloud builds submit --config=cloudbuild-job.yaml \
                 --substitutions=_VERSION="$VER" \
                 --project=aerotools-484814 \
                 --gcs-source-staging-dir=gs://aerotools-484814-cloudbuild-staging/staging \
                 --async --format='value(id)' .)
          echo "Build $ID — https://console.cloud.google.com/cloud-build/builds/$ID?project=217557350193"
          # El build ronda los 10 min con E2_HIGHCPU_8; el timeout del yaml es 3600s.
          for _ in $(seq 1 120); do
            STATUS=$(gcloud builds describe "$ID" --project=aerotools-484814 --format='value(status)')
            case "$STATUS" in
              SUCCESS) echo "Build SUCCESS"; exit 0 ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                echo "::error::Build $ID terminó en $STATUS"; exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::Build $ID sigue en curso tras 60 min"; exit 1
      # Cinturón sobre tirantes: que el build diga SUCCESS y que el tag exista en
      # Artifact Registry son dos cosas distintas, y la que importa es la segunda.
      - name: Verificar el tag en Artifact Registry
        run: |
          gcloud artifacts docker tags list \
            europe-west4-docker.pkg.dev/aerotools-484814/atom-organizer/pipeline \
            --project=aerotools-484814 --format='value(tag)' \
            | grep -qx "${{ needs.meta.outputs.version }}"
      # Solo las estables tocan producción. Una -rc deja la imagen publicada para
      # poder probarla a mano, pero no cambia el Job que usa el equipo.
      - name: Actualizar el Cloud Run Job (solo release estable)
        if: needs.meta.outputs.prerelease == 'false'
        run: |
          set -euo pipefail
          VER="${{ needs.meta.outputs.version }}"
          IMG="europe-west4-docker.pkg.dev/aerotools-484814/atom-organizer/pipeline:$VER"
          gcloud run jobs update atom-organizer-pipeline \
            --region=europe-west4 --project=aerotools-484814 --image="$IMG"
          # `update` puede devolver 0 y dejar la revisión anterior si algo falló
          # después; se comprueba lo que el Job tiene puesto de verdad.
          ACTUAL=$(gcloud run jobs describe atom-organizer-pipeline \
                     --region=europe-west4 --project=aerotools-484814 \
                     --format='value(spec.template.spec.template.spec.containers[0].image)')
          [ "$ACTUAL" = "$IMG" ] || { echo "::error::El Job quedó en $ACTUAL"; exit 1; }
          echo "Job atom-organizer-pipeline -> $VER"

  release:
    needs: [meta, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-assets
      - name: Publicar release con ambos binarios
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.version }}
          name: ATOM Organizer ${{ needs.meta.outputs.version }}
          prerelease: ${{ needs.meta.outputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            dist-assets/linux-appimage/ATOM_Organizer-*-x86_64.AppImage
            dist-assets/windows-installer/ATOM-Organizer-Setup-*.exe
