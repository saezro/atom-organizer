name: release

# Publica una release con los dos entregables de la UI webview por cada versión:
#   - Linux:   ATOM_Organizer-<ver>-x86_64.AppImage   (Qt/QtWebEngine, atom_organizer_webview_linux.spec)
#   - Windows: ATOM-Organizer-Setup-v<ver>.exe        (instalador Inno Setup sobre el onedir)
#
# El instalador (no un .exe suelto) es lo que consume el updater in-app
# (atom_core/updater.py): lo descarga y lo lanza con /VERYSILENT.
#
# Disparo:
#   - push de un tag  vX.Y.Z  → build + release ESTABLE (la que ve el updater).
#   - push de un tag  vX.Y.Z-rc1 → igual, pero marcada pre-release (no se ofrece).
#   - manual (workflow_dispatch) → indicar la versión; crea el tag en el sha actual.
#
# El tag DEBE coincidir con src/version.py (el job de Windows lo verifica y falla si no).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión/tag a publicar (p.ej. v3.3)'
        required: true
      prerelease:
        description: 'Marcar como pre-release'
        type: boolean
        default: true
      publicar:
        description: 'Publicar la release (si no, solo se construyen y suben los artifacts)'
        type: boolean
        default: true
      build_gpu:
        description: 'Incluir bundle GPU opt-in (cupy/nvidia, ORGANIZER_RGB_GPU=1). Por defecto NO: causó el cuelgue de 3.4.102'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      publicar: ${{ steps.v.outputs.publicar }}
    steps:
      - id: v
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          INPUT_PUBLICAR: ${{ inputs.publicar }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            V="${GITHUB_REF_NAME}"
            # Validación de formato (el tag puede llevar sufijo -rc1, -beta…).
            if ! printf '%s' "$V" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
              echo "::error::Tag con formato inválido"; exit 1
            fi
            # Un tag limpio (v3.2.0) publica ESTABLE — el updater in-app sólo ve
            # releases estables (`/releases/latest` de GitHub ignora las pre-release).
            # Para publicar una build de prueba que NO se ofrezca a nadie, etiqueta
            # con sufijo: v3.3.0-rc1, v3.3.0-beta…
            case "$V" in
              *-*) PRE=true ;;
              *)   PRE=false ;;
            esac
            echo "version=$V" >> "$GITHUB_OUTPUT"
            echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
            # Push de tag SIEMPRE publica — `publicar` es solo un dial manual del
            # workflow_dispatch, no cambia el comportamiento del push.
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          else
            if ! printf '%s' "$INPUT_VERSION" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Versión con formato inválido (se espera vX.Y.Z)"; exit 1
            fi
            case "$INPUT_PRERELEASE" in true|false) ;; *) echo "::error::prerelease inválido"; exit 1 ;; esac
            case "$INPUT_PUBLICAR" in true|false) ;; *) echo "::error::publicar inválido"; exit 1 ;; esac
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
            echo "prerelease=$INPUT_PRERELEASE" >> "$GITHUB_OUTPUT"
            echo "publicar=$INPUT_PUBLICAR" >> "$GITHUB_OUTPUT"
          fi

  # Puerta de calidad ANTES de gastar los dos builds. Nació de v3.4.24: un
  # `setForce(false)` huérfano (estado que se quitó en 4140633) reventaba
  # `pickCarpeta` en runtime, y como aquí no corría ni lint ni tests, lo único
  # que lo habría cazado era abrir la ventana a mano y mirar la consola.
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      # `no-undef` es la regla que caza los identificadores que dejó atrás un
      # refactor. Sin ella el bundle compila tan feliz y falla al pulsar.
      - name: Lint y tests de la UI
        working-directory: webui
        run: |
          npm ci
          npm run lint
          npm test
      # tests/test_smoke.py comprueba que exiftool y ffmpeg están en el PATH
      # porque el pipeline los invoca como subproceso. El runner no los trae:
      # sin esto la puerta falla siempre, aunque el código esté bien.
      - name: Binarios externos del pipeline
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libimage-exiftool-perl ffmpeg
      # Cachea el ENTORNO instalado (venv), no solo las descargas de pip
      # (eso ya lo hacía `cache: 'pip'` de setup-python, quitado arriba: es
      # redundante si el venv entero está en caché). Key por requirements
      # exactos de este job: cualquier cambio en ellos invalida el hit.
      - name: Cache venv Python
        id: cache-venv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .venv
          key: checks-venv-${{ runner.os }}-py3.11-${{ hashFiles('packaging/requirements/requirements-linux.txt', 'packaging/requirements/requirements-webview.txt') }}
      - name: Crear venv
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: python -m venv .venv
      - name: Python deps
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r packaging/requirements/requirements-linux.txt
          .venv/bin/pip install -r packaging/requirements/requirements-webview.txt
          .venv/bin/pip install pytest
      # Con o sin cache-hit, el venv (con o sin instalar de nuevo) pasa a ser
      # el `python`/`pytest` que ven los pasos siguientes.
      - name: Activar venv
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      # test_dark_theme.py falla EN RECOLECCIÓN desde antes de este workflow;
      # se excluye para no bloquear la puerta con deuda preexistente, no porque
      # sea prescindible. Arreglarlo y quitar el --ignore es tarea aparte.
      - name: Tests
        run: python -m pytest tests/ -q --ignore=tests/test_dark_theme.py

  build-linux:
    needs: [meta]
    # Era ubuntu-22.04, por construir contra la glibc más vieja posible y que el
    # AppImage corriera en cualquier sitio. Esa imagen ya no se sirve: los dos
    # intentos de v3.4.22 murieron sin ejecutar un solo paso ("The job was not
    # acquired by Runner of type hosted"). El suelo de glibc sube a la de 24.04;
    # el AppImage lo usa Linux moderno (Windows va por su instalador), así que
    # el coste es teórico y el de no publicar no lo era.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Build React UI (Vite)
        working-directory: webui
        run: |
          npm ci
          npm run build
      # Igual que en `checks`: venv cacheado entero, key con requirements +
      # build_gpu (el bundle GPU cambia qué se instala).
      - name: Cache venv Python
        id: cache-venv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .venv
          key: build-linux-venv-${{ runner.os }}-py3.11-gpu${{ inputs.build_gpu }}-${{ hashFiles('packaging/requirements/requirements-linux.txt', 'packaging/requirements/requirements-webview.txt', 'packaging/requirements/requirements-gpu.txt') }}
      - name: Crear venv
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: python -m venv .venv
      - name: Python deps
        if: steps.cache-venv.outputs.cache-hit != 'true'
        env:
          BUILD_GPU: ${{ github.event.inputs.build_gpu }}
        run: |
          .venv/bin/python -m pip install --upgrade pip
          # packaging/requirements/requirements-linux.txt (NO packaging/requirements/requirements.txt: esa lleva pywin32, solo-Windows)
          .venv/bin/pip install -r packaging/requirements/requirements-linux.txt
          .venv/bin/pip install -r packaging/requirements/requirements-webview.txt
          # cupy + nvImageCodec para el camino GPU opt-in (ORGANIZER_RGB_GPU=1,
          # atom_core/rgb_gpu.py). Build oficial va SIN esto (como 3.4.101):
          # el bundle GPU (~150MB de DLLs nvidia) precargaba con
          # pyi_rth_cuda.py y colgaba pywebview en máquinas sin runtime CUDA
          # (incidente 3.4.102). Solo se instala con ATOM_BUILD_GPU=1
          # (workflow_dispatch manual, opt-in).
          if [ "$BUILD_GPU" = "true" ]; then .venv/bin/pip install -r packaging/requirements/requirements-gpu.txt; fi
      - name: Activar venv
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      # El client_secret no está en el repo (es público: Google revocaría el
      # cliente por secret-scanning). Se inyecta aquí, solo en el runner.
      - name: Inyectar credenciales OAuth
        env:
          ATOM_GOOGLE_CLIENT_ID: ${{ secrets.ATOM_GOOGLE_CLIENT_ID }}
          ATOM_GOOGLE_CLIENT_SECRET: ${{ secrets.ATOM_GOOGLE_CLIENT_SECRET }}
        run: python scripts/inject_oauth_client.py
      - name: PyInstaller (onedir Qt/QtWebEngine)
        run: pyinstaller --clean --noconfirm packaging/atom_organizer_webview_linux.spec
      - name: Inject ipaddress en base_library.zip
        run: python packaging/inject_ipaddress.py
      - name: Montar AppImage
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: bash scripts/build_appimage.sh "$VERSION"
      - name: Smoke runtime AppImage (pipeline + índice Excel)
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: bash scripts/smoke_appimage_runtime.sh "ATOM_Organizer-${VERSION}-x86_64.AppImage"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-appimage
          path: ATOM_Organizer-*-x86_64.AppImage
          if-no-files-found: error

  build-windows:
    needs: [meta]
    runs-on: windows-latest
    steps:
      - name: Excluir el workspace de Defender
        # PyInstaller copia miles de ficheros de Qt/QtWebEngine y Defender los escanea
        # uno a uno: sin esta exclusion el paso tarda ~40% mas.
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE", "$env:RUNNER_TEMP"
        continue-on-error: true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Build React UI (Vite)
        working-directory: webui
        run: |
          npm ci
          npm run build
      # Venv cacheado (site-packages COMPLETO, no solo la descarga de pip):
      # en hit se salta por entero el `pip install` de Qt/PySide6/numpy/pandas
      # (los ~174s de "Python deps"). Key con requirements + build_gpu.
      - name: Cache venv Python
        id: cache-venv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .venv
          key: build-windows-venv-${{ runner.os }}-py3.11-gpu${{ inputs.build_gpu }}-${{ hashFiles('packaging/requirements/requirements.txt', 'packaging/requirements/requirements-webview.txt', 'packaging/requirements/requirements-gpu.txt') }}
      - name: Crear venv
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: python -m venv .venv
      - name: Python deps
        if: steps.cache-venv.outputs.cache-hit != 'true'
        # pwsh NO corta con el exit code de pip: un pip fallido (timeout de PyPI)
        # dejaba el paso en verde, venv sin pyinstaller y el fallo salía después.
        env:
          BUILD_GPU: ${{ github.event.inputs.build_gpu }}
          PIP_RETRIES: '10'
          PIP_DEFAULT_TIMEOUT: '60'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\pip.exe install -r packaging/requirements/requirements.txt
          .venv\Scripts\pip.exe install -r packaging/requirements/requirements-webview.txt
          # cupy + nvImageCodec para el camino GPU opt-in (ORGANIZER_RGB_GPU=1,
          # atom_core/rgb_gpu.py). Build oficial va SIN esto (como 3.4.101):
          # el bundle GPU (~150MB de DLLs nvidia) precargaba con
          # pyi_rth_cuda.py y colgaba pywebview en máquinas sin runtime CUDA
          # (incidente 3.4.102). Solo se instala con ATOM_BUILD_GPU=1
          # (workflow_dispatch manual, opt-in).
          if ($env:BUILD_GPU -eq "true") { .venv\Scripts\pip.exe install -r packaging/requirements/requirements-gpu.txt }
          # NO reinstalar PyInstaller aqui: manda el pin de packaging/requirements/requirements.txt
          # (6.22.2 + pyinstaller-hooks-contrib 2026.6). El 6.6.0 que habia
          # fijado desde la v3.4.32 degradaba esa version y sus hooks son
          # anteriores a numpy 2.x: no recogian las DLL de numpy.libs, asi que
          # el .exe petaba con "DLL load failed while importing
          # _multiarray_umath" en cuanto el pipeline importaba numpy (v3.4.73).
      # De aquí en adelante `python`/`pip`/`pyinstaller` resuelven al venv
      # (cacheado o recién creado), sin tocar el resto de los pasos.
      - name: Activar venv
        shell: pwsh
        run: "'{0}\\.venv\\Scripts' -f $PWD | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append"
      # El tag manda, pero la versión que la app enseña (y con la que compara al
      # buscar actualizaciones) sale de src/version.py: si no coinciden, el updater
      # ofrecería una actualización ya instalada en bucle. Se falla aquí.
      - name: Comprobar que el tag coincide con src/version.py
        shell: pwsh
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          $py = (.venv\Scripts\python.exe -c "import sys; sys.path.insert(0, 'src'); from version import __version__; print(__version__)").Trim()
          # v3.2.0 y v3.2.0-rc1 valen los dos para src/version.py = 3.2.0
          $tag = ($env:VERSION.TrimStart('v') -split '-')[0]
          if ($py -ne $tag) {
            Write-Error "Tag ($tag) != src/version.py ($py). Actualiza src/version.py y vuelve a etiquetar."
            exit 1
          }
      - name: Inyectar credenciales OAuth
        env:
          ATOM_GOOGLE_CLIENT_ID: ${{ secrets.ATOM_GOOGLE_CLIENT_ID }}
          ATOM_GOOGLE_CLIENT_SECRET: ${{ secrets.ATOM_GOOGLE_CLIENT_SECRET }}
        run: .venv\Scripts\python.exe scripts/inject_oauth_client.py
      - name: PyInstaller (onedir Qt/QtWebEngine)
        # El .spec (atom_organizer_webview.spec) solo empaqueta cupy/nvidia si
        # ATOM_BUILD_GPU == '1' (mira os.environ, no si packaging/requirements/requirements-gpu.txt se
        # instaló). Sin esto, un build_gpu=true instala los paquetes GPU pero
        # el .spec los ignora igual: bundle GPU nunca se empaqueta.
        env:
          ATOM_BUILD_GPU: ${{ inputs.build_gpu && '1' || '0' }}
        run: .venv\Scripts\pyinstaller.exe --clean --noconfirm packaging\atom_organizer_webview.spec
      # Solo para builds de validación (publicar=false): Inno Setup 6.7.0 no lo
      # abre ningún extractor, así que sin esto no hay forma de probar el .exe
      # sin instalar. Se sube el onedir crudo (dist/ATOM-Organizer) comprimido.
      - name: Comprimir onedir (build de validación)
        if: inputs.publicar == false
        shell: pwsh
        run: Compress-Archive -Path dist\ATOM-Organizer -DestinationPath windows-onedir.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: inputs.publicar == false
        with:
          name: windows-onedir
          path: windows-onedir.zip
          if-no-files-found: error
          retention-days: 7
      - name: Construir instalador (Inno Setup)
        shell: pwsh
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          $tag = $env:VERSION.TrimStart('v')
          # VersionInfoVersion sólo admite números → la versión va limpia (3.2.0) y
          # el sufijo (-rc1) sólo al nombre del fichero.
          $ver = ($tag -split '-')[0]
          # Inno Setup 6 viene preinstalado en los runners windows-latest
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyVersion=$ver" "/DMyTag=$tag" packaging\windows\ATOM-Organizer.iss
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-installer
          path: dist/installer/ATOM-Organizer-Setup-*.exe
          if-no-files-found: error

  # La imagen del Cloud Run Job (Dockerfile.job) se construía A MANO, y por eso
  # divergía del .exe: el 2026-08-14 el tag v3.4.41 tenía release publicada y
  # updater ofreciéndola mientras el Job seguía corriendo v3.4.40 — el estadillo
  # lo notificaba la app de escritorio y no el pipeline en la nube. Aquí se
  # publica con el mismo tag y en el mismo evento que los binarios.
  #
  # NO está en `needs` de `release` a propósito: si el build de la imagen falla,
  # el workflow queda en rojo pero la release de escritorio se publica igual.
  # Bloquear el .exe por un problema de GCP sería cambiar un fallo por otro.
  imagen-job:
    needs: [meta]
    # Build de validación (publicar=false): no tocar Artifact Registry.
    if: needs.meta.outputs.publicar == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Necesario para que el runner pida el token OIDC con el que se federa
      # contra GCP. Sin esto, `auth` falla con "unable to get ACTIONS_ID_TOKEN".
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Mismo control que hace build-windows: el tag manda sobre el nombre, pero
      # el código que va DENTRO de la imagen es el de src/version.py. Si no coinciden,
      # se publicaría una imagen mintiendo sobre su versión — justo el tipo de
      # divergencia que este job existe para evitar.
      - name: Comprobar que el tag coincide con src/version.py
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          PY=$(python3 -c "import sys; sys.path.insert(0, 'src'); from version import __version__; print(__version__)")
          TAG=$(printf '%s' "$VERSION" | sed 's/^v//' | cut -d- -f1)
          if [ "$PY" != "$TAG" ]; then
            echo "::error::Tag ($TAG) != src/version.py ($PY)"
            exit 1
          fi
      # Workload Identity Federation, no una clave JSON: el provider
      # `atom-organizer` tiene attribute-condition
      # assertion.repository=='saezro/atom-organizer', así que el token solo vale
      # desde ESTE repo y no hay credencial de larga vida que rotar ni filtrar.
      #
      # El provider va literal y no en `vars.`: no es un secreto (es un nombre de
      # recurso, y sin el token OIDC de ESTE repo no sirve de nada), y ponerlo en
      # una variable del repo añade un paso de configuración manual que, si se
      # olvida, rompe la release con un error opaco. El resto del workflow ya
      # hardcodea proyecto, región e imagen.
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: projects/217557350193/locations/global/workloadIdentityPools/github/providers/atom-organizer
          service_account: atom-compute-ops@aerotools-484814.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
      # --async + polling en vez de dejar que `gcloud builds submit` espere:
      # construyendo con la SA (que no es Viewer del proyecto) el submit NO puede
      # leer el bucket de logs por defecto, imprime un ERROR de streaming y sale
      # con código 0 SIN saber cómo acabó el build. Es decir: en modo síncrono un
      # build FALLIDO puede dar el paso por verde. Aquí el veredicto sale de
      # `builds describe`, que es el estado real.
      #
      # --gcs-source-staging-dir es obligatorio: a la SA se le concedió
      # objectAdmin solo sobre el bucket de staging (a nivel proyecto le daría
      # escritura sobre gs://plantas_pv_nl), no sobre el bucket por defecto.
      - name: Construir y publicar la imagen del Job
        env:
          VER: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          ID=$(gcloud builds submit --config=packaging/cloudbuild-job.yaml \
                 --substitutions=_VERSION="$VER" \
                 --project=aerotools-484814 \
                 --gcs-source-staging-dir=gs://aerotools-484814-cloudbuild-staging/staging \
                 --async --format='value(id)' .)
          echo "Build $ID — https://console.cloud.google.com/cloud-build/builds/$ID?project=217557350193"
          # El build ronda los 10 min con E2_HIGHCPU_8; el timeout del yaml es 3600s.
          for _ in $(seq 1 120); do
            STATUS=$(gcloud builds describe "$ID" --project=aerotools-484814 --format='value(status)')
            case "$STATUS" in
              SUCCESS) echo "Build SUCCESS"; exit 0 ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                echo "::error::Build $ID terminó en $STATUS"; exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::Build $ID sigue en curso tras 60 min"; exit 1
      # Cinturón sobre tirantes: que el build diga SUCCESS y que el tag exista en
      # Artifact Registry son dos cosas distintas, y la que importa es la segunda.
      - name: Verificar el tag en Artifact Registry
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          gcloud artifacts docker tags list \
            europe-west4-docker.pkg.dev/aerotools-484814/atom-organizer/pipeline \
            --project=aerotools-484814 --format='value(tag)' \
            | grep -qx "$VERSION"
      # Solo las estables tocan producción. Una -rc deja la imagen publicada para
      # poder probarla a mano, pero no cambia el Job que usa el equipo.
      - name: Actualizar el Cloud Run Job (solo release estable)
        if: needs.meta.outputs.prerelease == 'false'
        env:
          VER: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          IMG="europe-west4-docker.pkg.dev/aerotools-484814/atom-organizer/pipeline:$VER"
          gcloud run jobs update atom-organizer-pipeline \
            --region=europe-west4 --project=aerotools-484814 --image="$IMG"
          # `update` puede devolver 0 y dejar la revisión anterior si algo falló
          # después; se comprueba lo que el Job tiene puesto de verdad.
          ACTUAL=$(gcloud run jobs describe atom-organizer-pipeline \
                     --region=europe-west4 --project=aerotools-484814 \
                     --format='value(spec.template.spec.template.spec.containers[0].image)')
          [ "$ACTUAL" = "$IMG" ] || { echo "::error::El Job quedó en $ACTUAL"; exit 1; }
          echo "Job atom-organizer-pipeline -> $VER"

  release:
    # incluye `checks`: los builds ahora arrancan en paralelo con los tests, pero
    # no se publica nada si los tests fallan.
    # `publicar=false` (solo posible por workflow_dispatch manual, ver `meta`):
    # se saltan la publicación y el tag — los artifacts (AppImage/.exe) quedan
    # subidos igualmente por build-linux/build-windows para descargarlos a mano.
    needs: [meta, checks, build-linux, build-windows]
    if: needs.meta.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist-assets
      # Formato `<hex>  <nombre>` que parsea atom_core/updater.py (_parse_sums):
      # el nombre va sin ruta, igual que el asset publicado.
      - name: Generar SHA256SUMS.txt
        run: |
          sha256sum dist-assets/linux-appimage/ATOM_Organizer-*-x86_64.AppImage \
                    dist-assets/windows-installer/ATOM-Organizer-Setup-*.exe \
            | sed 's#  .*/#  #' > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publicar release con ambos binarios
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.meta.outputs.version }}
          name: ATOM Organizer ${{ needs.meta.outputs.version }}
          prerelease: ${{ needs.meta.outputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            dist-assets/linux-appimage/ATOM_Organizer-*-x86_64.AppImage
            dist-assets/windows-installer/ATOM-Organizer-Setup-*.exe
            SHA256SUMS.txt
